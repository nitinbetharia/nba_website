name: Build and deploy Insights

on:
  push:
    branches: [main]
    paths:
      - "insights-content/**"
      - "insights-11ty/**"
      - "assets/css/insights.css"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-insights.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [insights-content-updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4

      # Set repo variable USE_REMOTE_CONTENT=true and secret CONTENT_REPO_TOKEN
      # after nba-insights-content exists. Until then, bundled insights-content/ is used.
      - name: Checkout Insights content repo (writers-only)
        if: ${{ vars.USE_REMOTE_CONTENT == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTENT_REPO || 'nitinbetharia/nba-insights-content' }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: insights-content-remote

      - name: Use remote content when enabled
        if: ${{ vars.USE_REMOTE_CONTENT == 'true' }}
        run: |
          rm -rf insights-content
          mv insights-content-remote insights-content

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Insights + Decap admin
        run: npm run build:insights
        env:
          INSIGHTS_CONTENT_DIR: ${{ github.workspace }}/insights-content

      - name: Deploy to Hostinger (FTP)
        if: ${{ vars.FTP_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/insights-11ty/**
            **/.github/**
            **/package.json
            **/package-lock.json
            **/PROFESSIONAL_PROTECTION_STRATEGY.md
            **/insights-content/**
            **/.vscode/**
            **/ACCESS_CONTROL.txt
